<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة إدارة واهلاك الأصول الثابتة</title>
    <!-- استدعاء Tailwind CSS للتصميم السريع والعصري -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <!-- شريط العناوين العلوي -->
    <header class="bg-gradient-to-r from-blue-900 to-indigo-800 text-white shadow-md">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">🏢 إدارة الأصول الثابتة وإهلاكها</h1>
            <span class="bg-blue-700 text-xs px-3 py-1 rounded-full font-semibold">الإصدار 1.0</span>
        </div>
    </header>

    <main class="container mx-auto px-6 py-8">
        
        <!-- قسم إضافة أصل جديد -->
        <section class="bg-white rounded-xl shadow-sm p-6 mb-8 border border-slate-200">
            <h2 class="text-lg font-bold text-blue-900 mb-4 border-b pb-2">➕ إضافة أصل جديد</h2>
            <form id="assetForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">وصف الأصل</label>
                    <input type="text" id="assetName" required placeholder="مثال: أجهزة حاسب آلي للإدارة" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">تاريخ الشراء</label>
                    <input type="date" id="purchaseDate" required class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">تكلفة الاقتناء (ر.س)</label>
                    <input type="number" id="assetCost" required placeholder="0.00" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">القيمة التخريدية (ر.س)</label>
                    <input type="number" id="salvageValue" required placeholder="0.00" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">العمر الافتراضي (بالسنوات)</label>
                    <input type="number" id="usefulLife" required placeholder="5" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">طريقة الإهلاك</label>
                    <select id="depMethod" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="straight">قسط ثابت (Straight-Line)</option>
                    </select>
                </div>
                <div class="md:col-span-3 flex justify-end mt-2">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded-lg text-sm transition duration-200 shadow">
                        حفظ وإضافة الأصل للنظام
                    </button>
                </div>
            </form>
        </section>

        <!-- جدول الأصول الحالية -->
        <section class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
            <h2 class="text-lg font-bold text-blue-900 mb-4 border-b pb-2">📋 سجل الأصول الثابتة وجداول الإهلاك</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-700 text-xs uppercase border-b">
                            <th class="p-3">كود الأصل</th>
                            <th class="p-3">اسم الأصل</th>
                            <th class="p-3">تاريخ الشراء</th>
                            <th class="p-3">التكلفة</th>
                            <th class="p-3">العمر</th>
                            <th class="p-3">مجمع الإهلاك السنوي</th>
                            <th class="p-3">القيمة الدفترية</th>
                            <th class="p-3 text-center">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="assetsTableBody" class="text-sm divide-y divide-slate-100">
                        <!-- تُضاف الصفوف برمجياً هنا -->
                        <tr class="text-center text-slate-400">
                            <td colspan="8" class="py-6">لا توجد أصول مضافة حالياً. ابدأ بإضافة أصل جديد.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- سكربت التشغيل وحساب الإهلاك -->
    <script>
        let assets = [];

        document.getElementById('assetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('assetName').value;
            const date = document.getElementById('purchaseDate').value;
            const cost = parseFloat(document.getElementById('assetCost').value);
            const salvage = parseFloat(document.getElementById('salvageValue').value);
            const life = parseInt(document.getElementById('usefulLife').value);

            // حساب الإهلاك السنوي للقسط الثابت
            const annualDepreciation = (cost - salvage) / life;
            const currentBookValue = cost - annualDepreciation; // افتراضي للسنة الأولى

            const newAsset = {
                id: 'FA-' + Math.floor(1000 + Math.random() * 9000),
                name,
                date,
                cost,
                salvage,
                life,
                annualDepreciation: annualDepreciation.toFixed(2),
                bookValue: currentBookValue.toFixed(2)
            };

            assets.push(newAsset);
            renderTable();
            this.reset();
        });

        function renderTable() {
            const tbody = document.getElementById('assetsTableBody');
            if (assets.length === 0) {
                tbody.innerHTML = `<tr class="text-center text-slate-400"><td colspan="8" class="py-6">لا توجد أصول مضافة حالياً. ابدأ بإضافة أصل جديد.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            assets.forEach((asset, index) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-3 font-semibold text-blue-900">${asset.id}</td>
                        <td class="p-3">${asset.name}</td>
                        <td class="p-3">${asset.date}</td>
                        <td class="p-3">${asset.cost.toLocaleString()} ر.س</td>
                        <td class="p-3">${asset.life} سنوات</td>
                        <td class="p-3 text-red-600">${asset.annualDepreciation} ر.س</td>
                        <td class="p-3 font-bold text-emerald-600">${asset.bookValue} ر.س</td>
                        <td class="p-3 text-center">
                            <button onclick="deleteAsset(${index})" class="bg-red-50 text-red-600 px-3 py-1 rounded text-xs hover:bg-red-100 transition">استبعاد / حذف</button>
                        </td>
                    </tr>
                `;
            });
        }

        function deleteAsset(index) {
            if(confirm('هل أنت متأكد من رغبتك في استبعاد هذا الأصل؟')) {
                assets.splice(index, 1);
                renderTable();
            }
        }
    </script>
</body>
</html>
