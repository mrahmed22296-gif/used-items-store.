<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق المستعمل</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; }
        header { background-color: #2c3e50; color: white; padding: 20px; text-align: center; }
        .container { max-width: 1200px; margin: 20px auto; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .card { background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 280px; overflow: hidden; margin-bottom: 20px; }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .card-content { padding: 15px; }
        .price { color: #e74c3c; font-weight: bold; font-size: 1.2em; margin: 10px 0; }
        .btn { display: block; background: #27ae60; color: white; text-align: center; padding: 10px; text-decoration: none; border-radius: 4px; }
        .btn:hover { background: #219653; }
    </style>
</head>
<body>

    <header>
        <h1>متجر المنتجات المستعملة</h1>
        <p>أفضل العروض والصفقات للسلع بحالة ممتازة</p>
    </header>

    <div class="container" id="product-list">
        <!-- منتج تجريبي 1 -->
        <div class="card">
            <img src="https://via.placeholder.com/280x180" alt="صورة المنتج">
            <div class="card-content">
                <h3>أداة منزلية / جهاز</h3>
                <p>حالة المنتج: بحالة ممتازة، تم الفحص والتنظيف.</p>
                <div class="price">25 د.ك</div>
                <a href="https://wa.me/yourphonenumber" class="btn" target="_blank">تواصل للشرء عبر واتساب</a>
            </div>
        </div>
        
        <!-- يمكنك تكرار الكود بالأعلى لإضافة منتجات أخرى -->
    </div>

</body>
</html>
