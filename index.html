<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة روبوت الرد الآلي للواتساب</title>
    <!-- مكتبة لترجمة نص الـ QR إلى صورة باركود مرئية -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { color: #075e54; }
        .status-box {
            padding: 10px;
            margin: 15px 0;
            border-radius: 8px;
            font-weight: bold;
        }
        .disconnected { background-color: #ffebee; color: #c62828; }
        .connected { background-color: #e8f5e9; color: #2e7d32; }
        button {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #128c7e; }
        #qr-container {
            margin: 20px 0;
            padding: 15px;
            background: #fafafa;
            border: 1px dashed #ccc;
            border-radius: 8px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        canvas {
            max-width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🤖 روبوت واتساب بالذكاء الاصطناعي</h2>
        
        <div id="status" class="status-box disconnected">
            حالة الاتصال: جاري التحقق...
        </div>

        <div id="qr-container">
            <p id="qr-text">جاري جلب رمز الـ QR...</p>
            <canvas id="qr-canvas"></canvas>
        </div>

        <button onclick="checkStatus()">🔄 تحديث الحالة</button>
    </div>

    <script>
        const BACKEND_URL = 'https://whats-app-auto-replay.onrender.com';

        async function checkStatus() {
            const statusDiv = document.getElementById('status');
            const qrText = document.getElementById('qr-text');
            const canvas = document.getElementById('qr-canvas');

            try {
                const response = await fetch(`${BACKEND_URL}/api/status`);
                const data = await response.json();
                
                if (data.status === 'CONNECTED') {
                    statusDiv.className = 'status-box connected';
                    statusDiv.innerText = 'حالة الاتصال: متصل بنجاح ✅';
                    qrText.innerText = 'تم ربط الواتساب بنجاح، البوت يعمل الآن!';
                    canvas.style.display = 'none';
                } else {
                    statusDiv.className = 'status-box disconnected';
                    statusDiv.innerText = 'حالة الاتصال: بانتظار مسح رمز QR ⏳';
                    
                    if (data.qr) {
                        qrText.innerText = 'امسح الرمز أدناه من تطبيق واتساب:';
                        QRCode.toCanvas(canvas, data.qr, { width: 220 }, function (error) {
                            if (error) console.error(error);
                        });
                    } else {
                        qrText.innerText = 'جاري توليد رمز الـ QR من الخادم، انتظر قليلاً...';
                    }
                }
            } catch (error) {
                statusDiv.className = 'status-box disconnected';
                statusDiv.innerText = 'حالة الاتصال: خطأ في الاتصال بالخادم ❌';
                console.error('خطأ:', error);
            }
        }

        setInterval(checkStatus, 5000);
        checkStatus();
    </script>

</body>
</html>
