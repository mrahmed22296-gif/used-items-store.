<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة روبوت الرد الآلي للواتساب</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { color: #075e54; }
        .status-box {
            padding: 10px;
            margin: 15px 0;
            border-radius: 8px;
            font-weight: bold;
        }
        .disconnected { background-color: #ffebee; color: #c62828; }
        .connected { background-color: #e8f5e9; color: #2e7d32; }
        button {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #128c7e; }
        #qr-container {
            margin: 20px 0;
            padding: 15px;
            background: #fafafa;
            border: 1px dashed #ccc;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🤖 روبوت واتساب بالذكاء الاصطناعي</h2>
        
        <div id="status" class="status-box disconnected">
            حالة الاتصال: جاري التحقق...
        </div>

        <div id="qr-container">
            <p>حالة الخادم تعمل، راقب تيرمنال Render لرؤية رمز الـ QR أو تفقد التحديثات.</p>
        </div>

        <button onclick="checkStatus()">🔄 تحديث الحالة</button>
    </div>

    <script>
        // رابط خادمك الفعلي على Render
        const BACKEND_URL = 'https://whats-app-auto-replay.onrender.com';

        async function checkStatus() {
            const statusDiv = document.getElementById('status');
            try {
                const response = await fetch(`${BACKEND_URL}/api/status`);
                const data = await response.json();
                
                if (data.status === 'CONNECTED') {
                    statusDiv.className = 'status-box connected';
                    statusDiv.innerText = 'حالة الاتصال: متصل بنجاح ✅';
                } else {
                    statusDiv.className = 'status-box disconnected';
                    statusDiv.innerText = 'حالة الاتصال: بانتظار مسح رمز QR ⏳';
                }
            } catch (error) {
                statusDiv.className = 'status-box disconnected';
                statusDiv.innerText = 'حالة الاتصال: خطأ في الاتصال بالخادم ❌';
                console.error('خطأ في جلب الحالة:', error);
            }
        }

        // فحص الحالة تلقائياً كل 5 ثوانٍ
        setInterval(checkStatus, 5000);
        checkStatus();
    </script>

</body>
</html>
